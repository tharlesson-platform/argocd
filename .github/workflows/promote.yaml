name: Promote Image Between Environments

on:
  workflow_dispatch:
    inputs:
      source_env:
        description: Source environment
        required: true
        type: choice
        options:
          - dev
          - stage
      target_env:
        description: Target environment
        required: true
        type: choice
        options:
          - stage
          - prod
      image_tag:
        description: Optional explicit image tag (if empty uses source overlay tag)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ["argocd-run-${{ github.run_id }}"]
    timeout-minutes: 15
    environment: ${{ inputs.target_env == 'prod' && 'production' || 'staging' }}
    env:
      SOURCE_ENV: ${{ inputs.source_env }}
      TARGET_ENV: ${{ inputs.target_env }}
    steps:
      - name: Validate env transition
        run: |
          case "$SOURCE_ENV:$TARGET_ENV" in
            dev:stage|stage:prod) ;;
            *) echo 'Expected dev -> stage or stage -> prod' >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image tag
        id: resolve-tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          tag=$INPUT_TAG
          if [[ -z "$tag" ]]; then
            tag=$(awk '/newTag:/ {print $2}' "apps/sample-api/overlays/$SOURCE_ENV/kustomization.yaml" | tr -d '"')
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo 'Invalid image tag' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Update target overlay
        env:
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          bash github-actions/scripts/update_tag.sh "$TARGET_ENV" "$IMAGE_TAG"

      - name: Create promotion PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          branch: promotion/${{ inputs.source_env }}-to-${{ inputs.target_env }}-${{ github.run_number }}
          title: "Promote sample-api: ${{ inputs.source_env }} -> ${{ inputs.target_env }} (${{ steps.resolve-tag.outputs.tag }})"
          body: |
            GitOps promotion generated by workflow.

            - Source: `${{ inputs.source_env }}`
            - Target: `${{ inputs.target_env }}`
            - Image tag: `${{ steps.resolve-tag.outputs.tag }}`

            After merge, Argo CD reconciles target environment.
          commit-message: "chore(gitops): promote sample-api to ${{ inputs.target_env }} @ ${{ steps.resolve-tag.outputs.tag }}"
          add-paths: |
            apps/sample-api/overlays/${{ inputs.target_env }}/kustomization.yaml
