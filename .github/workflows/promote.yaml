name: Validate Promotion Locally

on:
  pull_request:
  push:
    branches: [main, master]
    paths: ["apps/sample-api/**", "github-actions/scripts/**", ".github/workflows/promote.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-promotion:
    runs-on: ["argocd-run-${{ github.run_id }}"]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        transition: ["dev:stage", "stage:prod"]
    steps:
      - name: Checkout da origem exata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Instalar validadores com checksum
        run: bash github-actions/scripts/install-local-tools.sh
      - name: Validar transformação somente em cópia descartável
        env:
          TRANSITION: ${{ matrix.transition }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          IFS=: read -r source target <<< "$TRANSITION"
          bash github-actions/scripts/validate-promotion.sh "$source" "$target" "sha-$SOURCE_SHA"
