name: Build Image and Validate Local Registry

on:
  push:
    branches: [main, master]
    paths: ["apps/sample-api/app/**", ".github/workflows/build-and-update-dev.yaml", "github-actions/scripts/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_SHARED_CREDENTIALS_FILE: /dev/null
  AWS_CONFIG_FILE: /dev/null

jobs:
  build-push-update:
    runs-on: ["argocd-run-${{ github.run_id }}"]
    timeout-minutes: 30
    steps:
      - name: Checkout da origem exata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Controles de integridade OCI
        run: python3 -m unittest discover -s github-actions/tests -v
      - name: Build, push/pull local, SCA e smoke da imagem
        run: bash github-actions/scripts/build-local-image.sh
