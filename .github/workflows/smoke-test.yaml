name: Smoke Test

on:
  pull_request:
  push:
    branches: [main, master]
    paths: ["apps/sample-api/app/**", "github-actions/scripts/**", ".github/workflows/smoke-test.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ["argocd-run-${{ github.run_id }}"]
    timeout-minutes: 15
    steps:
      - name: Checkout da origem exata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install -r apps/sample-api/app/requirements.txt
      - name: Smoke real da API somente no loopback
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python github-actions/scripts/local-smoke.py --version "$SOURCE_SHA"
